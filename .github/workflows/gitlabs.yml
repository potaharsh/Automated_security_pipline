
name: gitlabs CI/CD Gatekeeper


on:
  push:
    branches: [ main ]
  pull_request_target:
    branches: [ main ]


permissions:
  contents: read          
  security-events: write   

jobs:
  security-pipeline:
    name: Security Scans & Gatekeeper
    runs-on: ubuntu-latest

    steps:
      #Download our repository code into the runner VM
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      #Scan for hardcoded API keys and credentials
      - name: 1. Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      #Setup Python environment for SAST
      - name: 2. Set up Python
        if: always()
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      #Static Code Analysis for SQL Injection and code bugs
      - name: 3. SAST Code Scanning (Semgrep)
        if: always()
        run: |
          pip install semgrep
          semgrep scan --config=auto --severity ERROR --severity WARNING --sarif -o semgrep-results.sarif --error

      #Upload Semgrep findings to GitHub Security tab
      - name: 4. Upload Semgrep SARIF Report
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'semgrep-results.sarif'
          category: 'semgrep'

      #Scan dependencies and container image for known CVEs
      - name: 5. Container & Dependency Scan (Trivy)
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
      #Upload Trivy findings to GitHub Security tab
      - name: 6. Upload Trivy SARIF Report
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'
