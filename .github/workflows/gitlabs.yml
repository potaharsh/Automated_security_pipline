name: gitlabs CI/CD Gatekeeper
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read          
  security-events: write   
jobs:
  security-pipeline:
    name: Security Scans & Gatekeeper
    runs-on: ubuntu-latest
    steps:
      #Download our repository code into the runner VM
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      #Scan for hardcoded API keys and credentials
      - name: 1. Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #Setup Python environment for SAST
      - name: 2. Set up Python
        if: always()
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      #Static Code Analysis for SQL Injection and code bugs
      - name: 3. SAST Code Scanning (Semgrep)
        if: always()
        run: |
          pip install semgrep
          semgrep scan --config=auto --severity ERROR --severity WARNING --sarif -o semgrep-results.sarif
      #Upload Semgrep findings to GitHub Security tab
      - name: 4. Upload Semgrep SARIF Report
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b
        if: always()
        with:
          sarif_file: 'semgrep-results.sarif'
          category: 'semgrep'
        continue-on-error: true
      - name: 4b. Gate on Semgrep Findings
        if: always()
        run: |
          python3 -c "
          import json, sys
          with open('semgrep-results.sarif') as f:
              data = json.load(f)
          results = data['runs'][0]['results']
          if len(results) > 0:
              print(f'❌ {len(results)} blocking finding(s) detected.')
              for r in results:
                  rule = r.get('ruleId', 'unknown-rule')
                  loc = r.get('locations', [{}])[0].get('physicalLocation', {})
                  path = loc.get('artifactLocation', {}).get('uri', 'unknown-file')
                  line = loc.get('region', {}).get('startLine', '?')
                  print(f'  - [{rule}] {path}:{line}')
              sys.exit(1)
          print('✅ No blocking findings.')
          "
      #Scan dependencies and container image for known CVEs
      - name: 5. Container & Dependency Scan (Trivy)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'fs'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
      #Upload Trivy findings to GitHub Security tab
      - name: 6. Upload Trivy SARIF Report
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'
        continue-on-error: true
